version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: rootpilot-postgres
    environment:
      POSTGRES_DB: rootpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: rootpilot-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rootpilot-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"